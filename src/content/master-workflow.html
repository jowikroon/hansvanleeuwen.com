<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hans van Leeuwen — Master Workflow Command Center v2</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g0:#070810;--g1:#0d0f1c;--g2:#12142a;
  --teal:#00e5c8;--purple:#9b6dff;--amber:#f5a623;--coral:#ff5c57;--blue:#4facfe;--green:#43e97b;--pink:#f857a6;--lime:#a8e063;
  --t1:rgba(255,255,255,.92);--t2:rgba(255,255,255,.55);--t3:rgba(255,255,255,.28);--t4:rgba(255,255,255,.12);
  --glass:rgba(10,12,20,.72);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --r:20px;--r2:12px;--r3:8px;--pill:999px;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--g0);color:var(--t1);min-height:100vh;overflow-x:hidden}

/* BG */
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 15% 10%,rgba(0,229,200,.04) 0%,transparent 60%),
             radial-gradient(ellipse 60% 50% at 85% 85%,rgba(155,109,255,.05) 0%,transparent 60%),
             radial-gradient(ellipse 40% 40% at 50% 50%,rgba(79,172,254,.02) 0%,transparent 70%)}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 100% 100% at 50% 50%,black 20%,transparent 80%)}

/* LAYOUT */
.app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:48px 32px 100px}

/* NAV TABS */
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:48px;padding:6px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--pill)}
.nav-tab{padding:8px 18px;border-radius:var(--pill);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--t3);cursor:pointer;transition:all .2s;border:none;background:transparent;text-transform:uppercase}
.nav-tab:hover{color:var(--t2);background:rgba(255,255,255,.05)}
.nav-tab.active{color:var(--t1);background:rgba(255,255,255,.1);border:1px solid var(--border2)}

/* SECTION */
.section{display:none}.section.active{display:block}

/* HEADER */
.hdr-badge{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:var(--pill);background:rgba(0,229,200,.08);border:1px solid rgba(0,229,200,.2);font-family:'DM Mono',monospace;font-size:10px;color:var(--teal);letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.hdr-title{font-family:'Syne',sans-serif;font-size:clamp(26px,3.5vw,44px);font-weight:800;line-height:1.1;letter-spacing:-.02em}
.hdr-title span{color:var(--teal)}
.hdr-sub{font-size:13px;color:var(--t2);line-height:1.6;max-width:600px;margin-top:10px}

/* STATS ROW */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;margin-bottom:48px}
.stat{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:var(--pill);background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(20px)}
.stat-dot{width:7px;height:7px;border-radius:50%}
.stat-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase}
.stat-val{font-family:'Syne',sans-serif;font-size:14px;font-weight:700}

/* SECTION DIVIDER */
.sec-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--t3);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.sec-lbl::before{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07))}
.sec-lbl::after{content:'';flex:2;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.07),transparent)}

/* CARD BASE */
.card{border-radius:var(--r);border:1px solid var(--border);background:var(--glass);backdrop-filter:blur(24px);transition:transform .25s ease,border-color .25s,box-shadow .25s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 50%);pointer-events:none}
.card:hover{transform:perspective(1000px) rotateX(-.5deg) rotateY(.5deg) translateY(-3px);border-color:var(--border2)}
.card-accent-bar{height:2px;width:100%}

/* GRID LAYOUTS */
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}

/* SCHEDULE CARD */
.sched-hdr{padding:20px 22px 14px;display:flex;align-items:flex-start;gap:14px}
.sched-icon{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.sched-meta{flex:1}
.sched-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
.sched-time{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);margin-top:2px}
.sched-scope{display:flex;flex-wrap:wrap;gap:4px;padding:0 22px 12px}
.scope-tag{padding:2px 8px;border-radius:var(--pill);font-family:'DM Mono',monospace;font-size:9px;background:rgba(255,255,255,.05);color:var(--t3)}

/* FLOW STEPS */
.flow{padding:0 22px 16px}
.step{display:flex;gap:10px;padding:7px 0;position:relative}
.step:not(:last-child)::after{content:'';position:absolute;left:10px;top:28px;width:1px;height:calc(100% - 8px);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03))}
.step-n{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:8px;color:var(--t3);background:rgba(255,255,255,.04);flex-shrink:0;margin-top:1px}
.step-body{flex:1}
.step-name{font-size:12px;font-weight:500;line-height:1.3}
.step-desc{font-size:11px;color:var(--t2);margin-top:2px;line-height:1.4}
.step-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.stag{padding:2px 7px;border-radius:var(--pill);font-family:'DM Mono',monospace;font-size:9px;border:1px solid}

/* OUTPUT CHIPS */
.outputs{padding:12px 22px 18px;border-top:1px solid rgba(255,255,255,.05);display:flex;flex-wrap:wrap;gap:6px}
.ochip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r3);background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:11px;color:var(--t2)}
.odot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* PROMPT BLOCK */
.prompt-blk{margin:0 22px 20px;padding:12px 14px;border-radius:var(--r2);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.05)}
.prompt-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.prompt-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.copy-btn{padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--t3);cursor:pointer;font-family:'DM Mono',monospace;font-size:9px;transition:all .15s}
.copy-btn:hover{background:rgba(255,255,255,.08);color:var(--t2)}
.prompt-txt{font-family:'DM Mono',monospace;font-size:10px;color:var(--t2);line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow-y:auto}
.prompt-txt::-webkit-scrollbar{width:3px}.prompt-txt::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* STATUS badge */
.status-row{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sdot{width:7px;height:7px;border-radius:50%}
.s-active{background:var(--green);box-shadow:0 0 8px rgba(67,233,123,.5);animation:pulse 2.5s ease-in-out infinite}
.s-build{background:var(--amber)}
.s-paused{background:rgba(255,255,255,.25)}
.s-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3)}

/* ROUTING CARDS */
.route-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-bottom:44px}
.rcard{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-radius:14px;background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(20px);transition:border-color .2s}
.rcard:hover{border-color:var(--border2)}
.ricon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.rtrigger{font-size:10px;color:var(--t3);margin-bottom:3px;font-family:'DM Mono',monospace}
.raction{font-size:12px;font-weight:500}
.rtag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:var(--pill);font-size:9px;font-family:'DM Mono',monospace;border:1px solid;margin-top:4px}

/* PROJECT CARDS (non-schedule) */
.proj-card{padding:20px 22px}
.proj-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:4px}
.proj-domain{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);margin-bottom:12px}
.proj-status-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.proj-badge{padding:3px 10px;border-radius:var(--pill);font-family:'DM Mono',monospace;font-size:9px}
.proj-items{list-style:none}
.proj-items li{font-size:12px;color:var(--t2);padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:flex-start;gap:8px;line-height:1.4}
.proj-items li::before{content:'→';color:var(--t3);font-family:'DM Mono',monospace;font-size:10px;flex-shrink:0;margin-top:1px}
.proj-items li.done::before{content:'✓';color:var(--green)}
.proj-items li.warn::before{content:'!';color:var(--amber)}
.proj-items li.block::before{content:'✗';color:var(--coral)}

/* BRAND CARDS */
.brand-card{padding:16px 18px;border-radius:14px;background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(20px);transition:transform .2s,border-color .2s}
.brand-card:hover{transform:translateY(-2px);border-color:var(--border2)}
.brand-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:3px}
.brand-domain{font-family:'DM Mono',monospace;font-size:9px;color:var(--t3)}
.brand-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.btag{padding:2px 6px;border-radius:var(--pill);font-size:9px;font-family:'DM Mono',monospace;background:rgba(255,255,255,.05);color:var(--t3)}

/* MASTER PROMPT SECTION */
.mp-card{border-radius:var(--r);border:1px solid rgba(0,229,200,.2);background:rgba(0,229,200,.02);backdrop-filter:blur(24px);padding:28px;position:relative;overflow:hidden}
.mp-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,200,.4),transparent)}
.mp-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px}
.mp-sub{font-size:13px;color:var(--t2);margin-bottom:20px;line-height:1.6}
.mp-body{font-family:'DM Mono',monospace;font-size:10.5px;color:rgba(0,229,200,.8);line-height:1.7;white-space:pre-wrap;background:rgba(0,0,0,.4);padding:20px;border-radius:var(--r2);border:1px solid rgba(0,229,200,.1);max-height:500px;overflow-y:auto}
.mp-body::-webkit-scrollbar{width:4px}.mp-body::-webkit-scrollbar-thumb{background:rgba(0,229,200,.2);border-radius:2px}
.copy-mp{margin-top:14px;padding:9px 18px;border-radius:var(--r3);background:rgba(0,229,200,.1);border:1px solid rgba(0,229,200,.25);color:var(--teal);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;transition:background .15s;letter-spacing:.05em}
.copy-mp:hover{background:rgba(0,229,200,.18)}

/* INFRA GRID */
.infra-item{padding:16px 18px}
.infra-name{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;margin-bottom:4px}
.infra-host{font-size:10px;color:var(--t3);font-family:'DM Mono',monospace;margin-bottom:8px}
.infra-tags{display:flex;flex-wrap:wrap;gap:4px}
.itag{padding:2px 7px;border-radius:var(--pill);font-size:9px;font-family:'DM Mono',monospace;background:rgba(255,255,255,.05);color:var(--t3);border:1px solid rgba(255,255,255,.07)}
.infra-alert{margin-top:8px;padding:6px 10px;border-radius:6px;background:rgba(255,92,87,.08);border:1px solid rgba(255,92,87,.2);font-size:10px;color:#ff5c57;font-family:'DM Mono',monospace}

/* DIVIDER */
.divider{height:1px;background:rgba(255,255,255,.05);margin:40px 0}

/* CHANGELOG */
.changelog{padding:0}
.cl-item{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.cl-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);flex-shrink:0;width:68px;padding-top:2px}
.cl-body{flex:1}
.cl-title{font-size:13px;font-weight:500;margin-bottom:3px}
.cl-desc{font-size:11px;color:var(--t2);line-height:1.5}
.cl-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.cltag{padding:2px 7px;border-radius:var(--pill);font-family:'DM Mono',monospace;font-size:9px;border:1px solid}

/* RESPONSIVE */
@media(max-width:640px){.app{padding:20px 14px 60px}.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.nav{gap:2px}.nav-tab{padding:6px 12px;font-size:10px}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
</style>
</head>

function copyText(id){
  const el=document.getElementById(id);
  if(!el)return;
  navigator.clipboard.writeText(el.textContent).then(()=>{
    const btn=el.previousElementSibling?.querySelector('.copy-btn');
    if(btn){btn.textContent='✓ Copied';btn.style.color='var(--teal)';setTimeout(()=>{btn.textContent='Copy';btn.style.color=''},1800)}
  });
}
function copyMaster(){
  navigator.clipboard.writeText(MASTER_PROMPT).then(()=>{
    const btn=document.querySelector('.copy-mp');
    btn.textContent='✓ Copied to clipboard';
    setTimeout(()=>{btn.textContent='Copy master prompt'},2000);
  });
}

// 3D tilt on cards
function initTilt(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('mousemove',e=>{
      const rect=card.getBoundingClientRect();
      const x=(e.clientX-rect.left)/rect.width-.5;
      const y=(e.clientY-rect.top)/rect.height-.5;
      card.style.transform=`perspective(1000px) rotateX(${-y*3.5}deg) rotateY(${x*4}deg) translateY(-3px)`;
    });
    card.addEventListener('mouseleave',()=>{card.style.transform='perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)'});
  });
}
